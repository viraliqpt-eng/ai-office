<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Inteligente — AI Office™</title><link rel="stylesheet" href="css/crm.css"></head><body>
<aside><div class="brand">AI OFFICE™<span>CRM Inteligente</span></div><nav><a href="intelligence.html">✦ Intelligence</a><a class="active" href="crm.html">◉ CRM</a>
      <a href="tasks.html">✓ Tarefas</a><a href="cliente.html">← Área de Cliente</a></nav></aside>
<main><header><div><small>AI OFFICE™</small><h1>CRM Inteligente</h1><p>Leads, clientes e acompanhamento comercial num único espaço.</p></div><button id="newContact">+ Novo contacto</button></header>
<section class="stats"><article><span>Total</span><strong id="statTotal">0</strong></article><article><span>Leads</span><strong id="statLeads">0</strong></article><article><span>Clientes</span><strong id="statClients">0</strong></article><article><span>Valor estimado</span><strong id="statValue">€0</strong></article></section>
<section class="toolbar"><input id="search" placeholder="Pesquisar por nome, empresa ou email..."><select id="statusFilter"><option value="">Todos</option><option value="lead">Lead</option><option value="contactado">Contactado</option><option value="proposta">Proposta enviada</option><option value="negociacao">Negociação</option><option value="cliente">Cliente</option><option value="perdido">Perdido</option></select><button id="aiSummary">Resumo comercial com IA</button></section>
<section class="board"><div id="contactList" class="contact-list"></div><div id="contactPanel" class="contact-panel"><p class="empty">Selecione um contacto.</p></div></section></main>
<dialog id="contactDialog"><form id="contactForm"><h2 id="dialogTitle">Novo contacto</h2><input type="hidden" id="contactId"><div class="grid"><label>Nome<input id="fullName" required></label><label>Empresa<input id="company"></label><label>Email<input id="email" type="email"></label><label>Telefone<input id="phone"></label><label>Cargo<input id="role"></label><label>Origem<input id="source"></label><label>Estado<select id="status"><option value="lead">Lead</option><option value="contactado">Contactado</option><option value="proposta">Proposta enviada</option><option value="negociacao">Negociação</option><option value="cliente">Cliente</option><option value="perdido">Perdido</option></select></label><label>Valor estimado (€)<input id="estimatedValue" type="number" min="0" step="0.01"></label></div><label>Próxima ação<input id="nextAction"></label><label>Data da próxima ação<input id="nextActionAt" type="datetime-local"></label><label>Notas<textarea id="notes" rows="4"></textarea></label><div class="actions"><button type="button" id="cancelDialog">Cancelar</button><button type="submit">Guardar</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/crm.js"></script></body></html>
