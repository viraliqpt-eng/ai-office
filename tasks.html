<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas e Agenda — AI Office™</title><link rel="stylesheet" href="css/tasks.css"></head><body>
<aside class="sidebar"><div class="brand">AI OFFICE™<span>Tarefas & Agenda</span></div><nav><a href="intelligence.html">✦ Intelligence</a><a href="crm.html">◉ CRM</a><a class="active" href="tasks.html">✓ Tarefas</a><a href="cliente.html">← Área de Cliente</a></nav></aside>
<main><header><div><small>AI OFFICE™</small><h1>Tarefas e Agenda</h1><p>Organize próximas ações, compromissos e prioridades comerciais.</p></div><button id="newTask">+ Nova tarefa</button></header>
<section class="stats"><article><span>Pendentes</span><strong id="statPending">0</strong></article><article><span>Hoje</span><strong id="statToday">0</strong></article><article><span>Atrasadas</span><strong id="statLate">0</strong></article><article><span>Concluídas</span><strong id="statDone">0</strong></article></section>
<section class="toolbar"><input id="search" type="search" placeholder="Pesquisar tarefas..."><select id="statusFilter"><option value="">Todos os estados</option><option value="pending">Pendentes</option><option value="done">Concluídas</option></select><select id="priorityFilter"><option value="">Todas as prioridades</option><option value="high">Alta</option><option value="normal">Normal</option><option value="low">Baixa</option></select><button id="aiPlan">Plano diário com IA</button></section>
<section class="layout"><div><h2>Próximas tarefas</h2><div id="taskList" class="task-list"></div></div><aside class="agenda"><h2>Agenda dos próximos 7 dias</h2><div id="agendaList"></div></aside></section></main>
<dialog id="taskDialog"><form id="taskForm" method="dialog"><h2 id="dialogTitle">Nova tarefa</h2><input type="hidden" id="taskId"><label>Título<input id="title" required></label><label>Descrição<textarea id="description" rows="4"></textarea></label><div class="grid"><label>Prioridade<select id="priority"><option value="normal">Normal</option><option value="high">Alta</option><option value="low">Baixa</option></select></label><label>Estado<select id="status"><option value="pending">Pendente</option><option value="done">Concluída</option></select></label><label>Data e hora<input id="dueAt" type="datetime-local"></label><label>Contacto associado<select id="contactId"><option value="">Sem contacto</option></select></label></div><div class="dialog-actions"><button type="button" id="cancelDialog">Cancelar</button><button type="submit">Guardar</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/tasks.js"></script></body></html>
